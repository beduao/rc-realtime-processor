# Copie para config.yaml e ajuste. (config.yaml tem prioridade; este arquivo é o fallback.)

camera:
  # URL RTSP da câmera Intelbras (firmware base Dahua).
  #   substream (leve, recomendado p/ Pi): ...subtype=1
  #   stream principal (alta resolução):   ...subtype=0
  rtsp_url: "rtsp://admin:SUA_SENHA@192.168.0.10:554/cam/realmonitor?channel=1&subtype=1"
  reconnect_delay_seconds: 3

api:
  # Onde o uvicorn escuta. Informativo: o valor real vem do `--host` na linha
  # de comando. Para testar tudo numa máquina só, use 127.0.0.1 no uvicorn —
  # assim a API não fica exposta na rede e nenhum token é exigido.
  host: "127.0.0.1"
  port: 8000
  # Token para acesso DE OUTRA MÁQUINA. Testando tudo local (127.0.0.1), pode
  # deixar vazio: requisição da própria máquina é sempre liberada. Ao apontar
  # o painel para o IP do Pi, os dois configs precisam do mesmo valor aqui.
  #   python -c "import secrets;print(secrets.token_urlsafe(32))"
  token: ""
  # Endereço que o PAINEL usa para falar com a API.
  #   Fase 1 (tudo no Mac): http://localhost:8000
  #   Fase 2 (painel no PC): http://IP_DO_PI:8000
  base_url: "http://localhost:8000"

models:
  detector: "models/face_detection_yunet_2023mar.onnx"
  recognizer: "models/face_recognition_sface_2021dec.onnx"
  detector_input_width: 320
  detector_input_height: 240
  score_threshold: 0.8       # confiança mínima do detector
  nms_threshold: 0.3
  top_k: 50
  detect_width: 320          # reduz o frame p/ esta largura antes de detectar (0 = não reduz)

recognition:
  cosine_threshold: 0.363    # SFace (FR_COSINE): >= => mesma pessoa
  min_face_size: 60          # ignora rostos menores que isto (px)

worker:
  # realtime = reconhece na hora (bom para conferir cadastro e limiar)
  # captura  = rastreia e guarda recortes; o reconhecimento roda depois em
  #            lote (scripts/recognize_batch.py), por votação entre os
  #            recortes. É o modo que aguenta grupo — no corredor de escola,
  #            com várias crianças ao mesmo tempo, é este que se usa.
  # Trocar este valor vale sem reiniciar o worker.
  mode: realtime
  process_every_n_frames: 5  # processa 1 a cada N frames RECEBIDOS da câmera
  min_interval_seconds: 0.0  # teto de taxa: 0.5 = no máximo 2 processamentos/s (0 = sem teto)
  # Não registra a mesma identidade de novo nessa janela. Evita centenas de
  # eventos da mesma pessoa — correto para a chamada.
  # ATENÇÃO ao medir recall POR PASSAGEM (scripts/measure_recall.py): use 0.
  # Senão a segunda passagem da mesma pessoa dentro da janela não gera evento
  # e conta como "nunca detectada"; e como todos os desconhecidos dividem a
  # mesma chave, vários não reconhecidos juntos viram um evento só. No modo
  # captura o problema não existe — cada travessia é uma trilha.
  event_cooldown_seconds: 15
  draw_annotations: true
  opencv_threads: 0          # 0 = automático; no Pi 3B use 3 (deixa 1 núcleo p/ o decode)

# Usado só no modo captura. Os valores são os mesmos padrões do código, então
# a seção pode ser removida — existe para permitir ajuste e documentar.
tracking:
  iou_threshold: 0.3         # sobreposição mínima para considerar o mesmo rosto
  max_missing_frames: 8      # frames sem ver a pessoa antes de encerrar a trilha
  crops_per_track: 3         # recortes guardados por trilha (mais = mais votos)
  min_track_frames: 2        # trilha de 1 frame é descartada (falso positivo)
  crops_dir: "data/tracks"

# Reconhecimento em lote (scripts/recognize_batch.py).
batch:
  # Quantos recortes precisam concordar na mesma identidade para virar
  # presença. 2 equilibra bem com crops_per_track: 3. Suba para 3 se houver
  # falso positivo; desça para 1 se estiver perdendo gente.
  min_votos: 2

enroll:
  frames_to_capture: 5       # amostras boas por pessoa no cadastro
  capture_timeout_seconds: 10

storage:
  db_path: "data/data.db"
  snapshots_dir: "data/snapshots"
  # Preview ao vivo. No Raspberry Pi aponte para tmpfs (/dev/shm/facial-live.jpg):
  # o arquivo é reescrito ~2x/s e isso desgasta o cartão SD.
  live_path: "data/live.jpg"
