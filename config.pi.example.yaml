# Configuração ajustada para RASPBERRY PI 3B (4 núcleos 1.2 GHz, 1 GB RAM).
# O install_pi.sh copia este arquivo para config.yaml se ele ainda não existir.
#
# Só o que você PRECISA editar: camera.rtsp_url (linha abaixo).
#   Senha com caractere especial precisa ser codificada na URL:
#     @ -> %40    : -> %3A    / -> %2F    # -> %23    ? -> %3F    espaço -> %20
#   Ex.: senha "Th@2024#" fica "Th%402024%23"

camera:
  # SEMPRE use o substream (subtype=1) no Pi 3B. O stream principal derruba a CPU.
  rtsp_url: "rtsp://admin:SENHA_CODIFICADA@192.168.0.10:554/cam/realmonitor?channel=1&subtype=1"
  reconnect_delay_seconds: 5

  # WEBCAM USB ou CÂMERA CSI (alternativa quando a câmera IP não tem RTSP —
  # caso da linha Mibo). Troque rtsp_url por um índice ou dispositivo:
  #   rtsp_url: 0             (ou "/dev/video0")
  # As quatro chaves abaixo só têm efeito com dispositivo local:
  # width: 640
  # height: 480
  # fps: 15
  # mjpeg: true             # MJPEG em vez de vídeo cru: essencial em USB 2.0

api:
  host: "0.0.0.0"
  port: 8000
  # No Pi a API fala consigo mesma. O PAINEL (no seu PC) usa o IP do Pi
  # no config.yaml DELE — não aqui.
  base_url: "http://localhost:8000"

models:
  detector: "models/face_detection_yunet_2023mar.onnx"
  recognizer: "models/face_recognition_sface_2021dec.onnx"
  # Para ganhar ~2x de velocidade, rode `python models/download_models.py --int8`
  # e troque pelos caminhos abaixo (depois recalibre o cosine_threshold):
  #   detector:   "models/face_detection_yunet_2023mar_int8.onnx"
  #   recognizer: "models/face_recognition_sface_2021dec_int8.onnx"
  detector_input_width: 320
  detector_input_height: 240
  score_threshold: 0.8
  nms_threshold: 0.3
  # ATENÇÃO: top_k é o número MÁXIMO de rostos que o detector devolve por frame.
  # Se passar mais gente que isso ao mesmo tempo, o excedente é DESCARTADO —
  # não existe para o sistema. Em ambiente com grupos (corredor de escola),
  # mantenha folga: 50 ou mais. Custa pouco (o caro é o embedding, não a detecção).
  top_k: 50
  detect_width: 320          # detecta em 320px de largura e reescala as caixas

recognition:
  cosine_threshold: 0.363    # calibre com fotos reais do local (veja o GUIA)
  min_face_size: 50          # px no frame ORIGINAL; abaixo disso o embedding é ruim

worker:
  # ---------------------------------------------------------------------------
  # MODO DE OPERAÇÃO — a escolha mais importante do arquivo.
  #
  # "realtime": reconhece na hora. Custa ~285 ms POR ROSTO, então com várias
  #    pessoas no mesmo frame o Pi não acompanha o vídeo e perde gente.
  #    Adequado a fluxo esparso, uma pessoa por vez.
  #
  # "captura": só detecta e rastreia, guardando os melhores recortes de cada
  #    pessoa; o reconhecimento roda depois, em lote. A detecção custa ~57 ms
  #    por frame INDEPENDENTE de quantos rostos haja, então a captura aguenta
  #    o corredor cheio. E como cada pessoa gera vários recortes, a decisão sai
  #    por votação — bem mais precisa. Use para grupos e chamada de presença.
  #      Reconhecer:  python scripts/recognize_batch.py
  #      Presença:    python scripts/recognize_batch.py --presenca
  # ---------------------------------------------------------------------------
  mode: "realtime"
  # O worker relê `mode` neste intervalo e troca SEM reiniciar o serviço. Use
  #   python scripts/set_mode.py captura
  # para alternar. Os demais parâmetros continuam exigindo reinício.
  mode_check_seconds: 10

  # Só valem no modo "realtime" (no modo captura o worker processa todo frame):
  process_every_n_frames: 2
  min_interval_seconds: 0.5
  event_cooldown_seconds: 20 # evita encher o cartão SD de snapshots repetidos
  draw_annotations: true
  opencv_threads: 3          # 3 na DNN + 1 núcleo livre p/ o decode do RTSP

enroll:
  frames_to_capture: 5
  capture_timeout_seconds: 15

# Rastreamento — só usado no modo "captura".
tracking:
  iou_threshold: 0.3         # sobreposição mínima para considerar o mesmo rosto
  max_missing_frames: 8      # frames sem ver a pessoa antes de encerrar a trilha
  crops_per_track: 3         # quantos recortes guardar por pessoa (mais = mais votos)
  min_track_frames: 2        # trilha de 1 frame é descartada (falso positivo do detector)
  crops_dir: "data/tracks"

# Reconhecimento em lote.
batch:
  # Quantos recortes precisam concordar na mesma identidade para virar presença.
  # 2 é um bom equilíbrio com crops_per_track: 3. Suba para 3 se ainda houver
  # falso positivo; desça para 1 se estiver perdendo gente.
  min_votos: 2

storage:
  db_path: "data/data.db"
  snapshots_dir: "data/snapshots"
  live_path: "/dev/shm/facial-live.jpg"   # tmpfs: NÃO escreve no cartão SD
